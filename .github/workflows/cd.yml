name: CD

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Canonical release tag to publish
        required: true
        type: string
      release_mode:
        description: Select changed packages or every package
        default: changed
        required: true
        type: choice
        options:
          - changed
          - all

jobs:
  cd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_MODE: ${{ inputs.release_mode }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = 'release' ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            if printf '%s\n' "$RELEASE_BODY" | grep -Eq '(^|[[:space:]])release-mode:[[:space:]]*all([[:space:]]|$)'; then
              echo 'mode=all' >> "$GITHUB_OUTPUT"
            else
              echo 'mode=changed' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tag=$INPUT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "mode=$INPUT_RELEASE_MODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release plan
        id: release_plan
        env:
          RELEASE_MODE: ${{ steps.release.outputs.mode }}
          RELEASE_PLAN_PATH: ${{ runner.temp }}/release-plan.json
        run: |
          node scripts/release/generate-release-plan.js "${{ steps.release.outputs.tag }}" > "$RELEASE_PLAN_PATH"
          package_count=$(node -e 'const { packageNames } = JSON.parse(require("node:fs").readFileSync(process.env.RELEASE_PLAN_PATH)); process.stdout.write(String(packageNames.length));')
          echo "package_count=$package_count" >> "$GITHUB_OUTPUT"

      - name: Stage release manifests
        env:
          RELEASE_PLAN_PATH: ${{ runner.temp }}/release-plan.json
        run: |
          node scripts/release/stage-release.js "${{ steps.release.outputs.tag }}" "$RELEASE_PLAN_PATH"
          npm install

      - name: Check code
        run: npm run check:code

      - name: Check types
        run: npm run check:type

      - name: Check boundaries
        run: npm run check:boundaries

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check packages
        run: npm run check:packages

      - name: Publish packages
        if: steps.release_plan.outputs.package_count != '0'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_PLAN_PATH: ${{ runner.temp }}/release-plan.json
        run: |
          node -e "const { packageNames } = JSON.parse(require('node:fs').readFileSync(process.env.RELEASE_PLAN_PATH)); process.stdout.write(packageNames.join('\\n'));" | while IFS= read -r package_name; do
            if [ "$package_name" = '@koala-ts/framework' ]; then
              npm publish --provenance --access public
            else
              npm publish --workspace="$package_name" --provenance --access public
            fi
          done

      - name: Mirror released components
        if: steps.release_plan.outputs.package_count != '0'
        env:
          KOALA_TS_MIRROR_TOKEN: ${{ secrets.KOALA_TS_MIRROR_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_PLAN_PATH: ${{ runner.temp }}/release-plan.json
        run: |
          if node -e "const { packageNames } = JSON.parse(require('node:fs').readFileSync(process.env.RELEASE_PLAN_PATH)); process.exit(packageNames.includes('@koala-ts/contracts') ? 0 : 1);"; then
            mirror_directory=$(mktemp -d)
            git clone "https://x-access-token:${KOALA_TS_MIRROR_TOKEN}@github.com/koala-ts/contracts.git" "$mirror_directory"
            git -C "$mirror_directory" checkout -B main
            rsync -a --delete --exclude .git --exclude dist --exclude node_modules src/packages/contracts/ "$mirror_directory/"
            git -C "$mirror_directory" config user.name 'koala-ts-release-bot'
            git -C "$mirror_directory" config user.email 'release-bot@koala-ts.dev'
            git -C "$mirror_directory" add --all
            if ! git -C "$mirror_directory" diff --cached --quiet; then
              git -C "$mirror_directory" commit -m "chore(release): mirror ${RELEASE_TAG}"
            fi
            git -C "$mirror_directory" tag -fa "$RELEASE_TAG" -m "Release ${RELEASE_TAG}"
            git -C "$mirror_directory" push --force origin main
            git -C "$mirror_directory" push --force origin "refs/tags/${RELEASE_TAG}"
          fi
