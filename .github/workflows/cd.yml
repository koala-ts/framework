name: CD

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  cd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Set version
        run: |
          echo "Setting version to $GITHUB_REF_NAME"
          npm version "$GITHUB_REF_NAME" --no-git-tag-version
          npm install

      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
