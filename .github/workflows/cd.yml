name: CD

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Canonical release tag to publish
        required: true
        type: string

jobs:
  cd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Select release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = 'release' ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$INPUT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply release version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: npm pkg set "version=$RELEASE_TAG"

      - name: Check code
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Check boundaries
        run: npm run depcruise

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check packages
        run: npm run publint

      - name: Publish framework
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

  split_components:
    needs: cd
    uses: ./.github/workflows/split-components.yml
    with:
      source_ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
      source_branch: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
      source_type: tag
      sync: true
    secrets: inherit
